steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/rosesli', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rosesli']

  # Secrets live in Secret Manager (migrated 2026-06-15). Values are referenced
  # below via --update-secrets; the runtime SA has secretAccessor on each.
  # To rotate a secret, add a new version:
  #   printf '%s' 'NEWVALUE' | gcloud secrets versions add rosesli-db-pass --data-file=-
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rosesli'
      - '--image=gcr.io/$PROJECT_ID/rosesli'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--update-env-vars=COMPANY_ID=rosesli,APP_URL=https://rosesli.com,DB_NAME=botdb,DB_USER=botuser,GCS_BUCKET=rosesli-portal-docs,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_USER=info@rosesli.com,SMTP_FROM=Rose Sign Language Interpreting <info@rosesli.com>'
      - '--update-secrets=DB_PASS=rosesli-db-pass:latest,JWT_SECRET=rosesli-jwt-secret:latest,FLASK_SECRET_KEY=rosesli-flask-secret-key:latest,SMTP_PASS=rosesli-smtp-pass:latest,RESEND_API_KEY=rosesli-resend-api-key:latest'

images:
  - 'gcr.io/$PROJECT_ID/rosesli'
