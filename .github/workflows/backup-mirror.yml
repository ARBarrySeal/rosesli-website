name: Backup mirror to private repo

# Mirrors this repository to ARBarrySeal/rosesli-website-backup on every push
# (all branches and tags). The backup is an exact --mirror copy, kept in sync.
# Auth: SSH deploy key (write) on the backup repo, stored here as the
# BACKUP_DEPLOY_KEY secret. main is separately protected against force-push/delete.

on:
  push:
    branches: ['**']
    tags: ['**']

# Queue mirror pushes so two runs never race on --mirror.
concurrency:
  group: backup-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source as a bare mirror
        run: |
          git clone --mirror \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            repo.git

      - name: Configure deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BACKUP_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push mirror to backup repo
        run: |
          cd repo.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            git push --mirror git@github.com:ARBarrySeal/rosesli-website-backup.git
