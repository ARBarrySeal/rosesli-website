<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Create New Password</title>
<link rel="stylesheet" href="/portal.css"/>
</head>
<body class="auth-page">
<div class="auth-box">
  <h1>Create your new password</h1>
  <p>You signed in with a temporary password. Please choose a new one to continue.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <label>New password
      <input type="password" name="new_password" required minlength="7" autofocus
             autocomplete="new-password"/>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="7"
             autocomplete="new-password"/>
    </label>
    <p style="font-size:.85em;">Must be at least 7 characters and include one capital letter,
       one number, and one special character.</p>
    <button type="submit">Save password</button>
  </form>
  <a href="/logout" class="btn-link">Sign out</a>
</div>
</body>
</html>
