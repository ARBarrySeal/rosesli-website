<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Invite User</title>
<link rel="stylesheet" href="/portal.css"/>
</head>
<body class="auth-page">
<div class="auth-box">
  <h1>Invite a new user</h1>
  {% if sent %}
    <p class="success">Invitation sent to {{ email }}.</p>
    <a href="/portal/admin/invite" class="btn-link">Invite another</a>
  {% else %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <label>Full name<input type="text" name="full_name" required autofocus/></label>
      <label>Email address<input type="email" name="email" required/></label>
      <label>Role
        <select name="role" style="background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font);padding:.5rem .75rem;border-radius:var(--radius);font-size:13px;">
          <option value="client">Client</option>
          <option value="employee">Employee</option>
        </select>
      </label>
      <button type="submit">Send invitation</button>
    </form>
    <a href="/portal" class="btn-link">← Back to portal</a>
  {% endif %}
</div>
</body>
</html>
