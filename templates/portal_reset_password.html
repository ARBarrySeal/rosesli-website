<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Set New Password</title>
<link rel="stylesheet" href="/portal.css"/>
</head>
<body class="auth-page">
<div class="auth-box">
  {% if invalid %}
    <h1>Link expired</h1>
    <p>This reset link is invalid or has expired. <a href="/forgot-password">Request a new one</a>.</p>
  {% elif success %}
    <h1>Password updated</h1>
    <p>Your password has been changed. <a href="/">Sign in</a>.</p>
  {% else %}
    <h1>Set new password</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
      <input type="hidden" name="token" value="{{ token }}"/>
      <label>New password (min 8 characters)<input type="password" name="password" required minlength="8"/></label>
      <label>Confirm password<input type="password" name="confirm" required minlength="8"/></label>
      <button type="submit">Set password</button>
    </form>
  {% endif %}
</div>
</body>
</html>
